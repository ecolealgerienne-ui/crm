# =============================================================================
# Docker Compose — EchangoCrm (Odoo 19) — DÉVELOPPEMENT LOCAL
# =============================================================================
# Même structure que la production (docker-compose.crm.yml) : même image, même
# amorçage automatique, mêmes options Odoo. Ne diffèrent que les ports, publiés
# ici sur l'hôte, l'absence de Traefik, et les secrets.
#
#   docker compose up -d
#   → http://localhost:8069
#
# Le premier lancement crée la base et installe les modules tout seul ; compter
# quelques minutes, à suivre avec `docker compose logs -f odoo-init`.
#
# ⚠️ Les identifiants ci-dessous sont des valeurs de développement, écrites en
# clair dans un fichier versionné. Sans danger tant que rien n'est exposé hors
# du poste — et elles n'ont RIEN à faire sur le VPS, dont les secrets vivent
# dans .env.production (gitignoré).
#
# `name:` explicite : sans lui, Compose déduirait `echangocrm` du nom du
# dossier, le même nom que la stack de production, et les deux partageraient le
# volume Postgres physique. Voir l'en-tête de docker-compose.crm.yml.
name: echangocrm-dev

x-odoo-base: &odoo-base
  image: odoo:${ODOO_IMAGE_TAG:-19}
  environment:
    # Noms imposés par l'entrypoint de l'image officielle — voir le commentaire
    # détaillé dans docker-compose.crm.yml.
    HOST: postgres_crm
    PORT: 5432
    USER: odoo
    PASSWORD: odoo
    ODOO_ADMIN_PASSWORD: admin
  volumes:
    - odoo_data:/var/lib/odoo
    - ./addons:/mnt/extra-addons:ro
# =============================================================================

services:
  postgres_crm:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    ports:
      # ⚠️ Ports décalés, pas par goût : le WSL de développement fait tourner
      # une dizaine de stacks de la suite en même temps. Au 2026-08-09 étaient
      # déjà pris 5433 (echangopromo), 5434 (echango-invoice), 5440
      # (echango-vierge), et surtout 8069/8072 par l'Odoo du projet
      # echangoorder (/home/amar/projects/echangoorder/backend).
      # Vérifier avant d'en changer :  ss -ltnH | awk '{print $4}'
      - '5436:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U odoo -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # Crée la base et installe les modules, puis s'arrête. « Exited (0) » est le
  # résultat normal, pas une panne.
  odoo-init:
    <<: *odoo-base
    restart: 'no'
    depends_on:
      postgres_crm:
        condition: service_healthy
    command:
      - odoo
      - --database=echango_crm
      - --init=crm,contacts,calendar,echangocrm_bootstrap
      # Pas de --without-demo ici, contrairement à la production : les données
      # de démonstration rendent le pipeline CRM lisible dès le premier
      # lancement, ce qu'on veut pour développer. Ajouter `--without-demo=True`
      # pour reproduire une base vierge comme en production.
      - --stop-after-init
      - --log-level=info

  odoo:
    <<: *odoo-base
    restart: unless-stopped
    depends_on:
      postgres_crm:
        condition: service_healthy
      odoo-init:
        condition: service_completed_successfully
    command:
      - odoo
      - --database=echango_crm
      - --db-filter=^echango_crm$$
      - --no-database-list
      # Défaut actuel, mais il change en Odoo 20 (127.0.0.1) — voir le
      # commentaire dans docker-compose.crm.yml.
      - --http-interface=0.0.0.0
      # workers >= 2 même en développement : c'est la seule façon d'avoir le
      # port gevent (8072) actif, donc de reproduire le comportement du
      # websocket tel qu'il tourne derrière Traefik en production.
      - --workers=2
      - --max-cron-threads=1
      # Tiret bas — voir le commentaire dans docker-compose.crm.yml.
      - --db_maxconn=16
      - --log-level=info
    ports:
      # 8169/8172 côté hôte, 8069/8072 côté conteneur : les ports Odoo
      # standards sont déjà pris par le projet echangoorder sur ce poste.
      # → http://localhost:8169
      - '8169:8069'
      - '8172:8072'

volumes:
  postgres_data:
  odoo_data:
