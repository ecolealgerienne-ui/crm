# Niveau d'API simule pour les tests unitaires.
#
# L'application cible l'API 36, que Robolectric 4.14.1 ne sait pas simuler :
# sans cette ligne, tous les tests echouent au demarrage sur
# « Package targetSdkVersion=36 > maxSdkVersion=35 », ce qui n'a aucun rapport
# avec ce qu'ils verifient.
#
# Ce que ces tests couvrent — curseur de balayage, file SQLite, plage horaire —
# ne depend d'aucune API introduite apres 35. Le jour ou ce sera le cas, c'est
# la version de Robolectric qu'il faudra monter, en meme temps que le jar
# `android-all-instrumented` declare dans build.gradle.kts.
sdk=35
