# =============================================================================
# Docker Compose — EchangoCrm (Odoo 19) — PRODUCTION VPS
# =============================================================================
# Stack autonome, clonée dans /opt/echangocrm. Elle ne partage avec les autres
# projets du VPS (Vendure, echango Promo) QUE deux choses :
#   - le réseau Docker externe `echango_network` ;
#   - le conteneur Traefik qui y est attaché, et son certificat wildcard
#     *.echango.com (echangocrm.echango.com est donc déjà couvert, aucune
#     configuration ACME à ajouter).
# Aucun code partagé, aucune image construite localement, aucune base partagée,
# et — choix délibéré, voir la section « labels » — aucun middleware Traefik
# emprunté à un autre dépôt.
#
# Prérequis : `echango_network` doit déjà exister (stack principale démarrée
# au moins une fois). Vérifier : docker network inspect echango_network
#
# UNE SEULE COMMANDE, et le CRM est en ligne :
#
#   docker compose --env-file .env.production -f docker-compose.crm.yml up -d
#
# Le service `odoo-init` crée la base et installe les modules au premier
# lancement ; il n'y a aucune étape manuelle. Détails : docs/DEPLOIEMENT_VPS.md
#
# `name:` explicite : sans lui, Compose dérive le nom de projet du nom du
# dossier (`echangocrm`), donc le MÊME que docker-compose.yml (dev local) — les
# deux stacks partageraient alors le volume Postgres physique
# `echangocrm_postgres_data`. Deux processus Postgres écrivant le même
# répertoire de données corrompent le catalogue ; c'est arrivé sur le dépôt
# echangopromo le 2026-07-12, ce préfixe distinct est la correction.
name: echangocrm

# ─────────────────────────────────────────────────────────────────────────────
# Base commune aux DEUX conteneurs Odoo (l'amorçage et le serveur).
#
# Ils exécutent le même Odoo sur la même base et le même filestore : leurs
# environnements DOIVENT rester identiques. Les tenir à la main les ferait
# diverger — c'est exactement ce qui est arrivé à l'ancre x-vendure-env de la
# stack Vendure, dont le worker avait perdu une clé sans que rien ne le
# signale. Seule la ligne de commande diffère, et elle est écrite à part.
# ─────────────────────────────────────────────────────────────────────────────
x-odoo-base: &odoo-base
  # Image officielle, telle quelle. Rien n'est construit : pas de Dockerfile à
  # maintenir, pas d'étape `--build`, et les correctifs Odoo arrivent par un
  # simple `pull`.
  image: odoo:${ODOO_IMAGE_TAG:-19}
  environment:
    # ⚠️ Ces quatre noms sont IMPOSÉS par l'entrypoint de l'image officielle,
    # qui les traduit en --db_host / --db_port / --db_user / --db_password.
    # Les renommer (DB_HOST, POSTGRES_USER…) ne produirait aucune erreur : Odoo
    # retomberait silencieusement sur ses valeurs par défaut, et échouerait à
    # se connecter pour une raison sans rapport apparent.
    #
    # `postgres_crm`, PAS `postgres` : le réseau echango_network est partagé
    # avec la stack Vendure, qui a son propre service nommé `postgres`. Un
    # conteneur attaché aux deux réseaux résout le nom générique vers LEUR
    # conteneur — incident réel sur echango Promo, dont le symptôme
    # (« password authentication failed » avec un mot de passe pourtant exact)
    # n'oriente pas du tout vers un problème de résolution DNS. Voir §6 de
    # docs/DEPLOIEMENT_VPS.md.
    HOST: postgres_crm
    PORT: 5432
    USER: odoo
    PASSWORD: ${POSTGRES_PASSWORD:?requis — voir .env.production.example}

    # Lu par addons/echangocrm_bootstrap au moment de l'installation, pour
    # remplacer le mot de passe `admin` par défaut d'Odoo. Le `:?` fait échouer
    # `docker compose up` AVANT que quoi que ce soit démarre si la variable
    # manque : c'est voulu, un CRM public avec admin/admin ne doit pas pouvoir
    # exister, même quelques minutes.
    ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:?requis — voir .env.production.example}
  volumes:
    # Filestore : pièces jointes, images, documents, sessions.
    # ⚠️ Aussi vital que la base — un dump SQL seul restaure un CRM dont toutes
    # les pièces jointes sont cassées. Voir §7 de docs/DEPLOIEMENT_VPS.md.
    - odoo_data:/var/lib/odoo
    # Addons custom versionnés dans ce dépôt. En lecture seule : un module de
    # production s'ajoute par commit + `git pull`, jamais par téléversement
    # dans l'interface, sinon le code qui tourne n'existe nulle part.
    - ./addons:/mnt/extra-addons:ro
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — dédié, jamais joignable depuis echango_network
  # ---------------------------------------------------------------------------
  # Réseau `internal` uniquement, aucun port publié sur l'hôte : la base n'a
  # aucune raison d'être atteignable depuis le réseau partagé avec les autres
  # stacks.
  postgres_crm:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?requis — voir .env.production.example}
      # Base d'amorçage seulement. La base applicative est créée par Odoo
      # lui-même au premier démarrage (voir odoo-init). Le rôle `odoo` est
      # superutilisateur du conteneur, il a donc le droit CREATEDB qu'Odoo
      # exige — sans lui, rien ne se crée.
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U odoo -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  # ---------------------------------------------------------------------------
  # Amorçage — crée la base et installe les modules, puis s'arrête
  # ---------------------------------------------------------------------------
  # C'est ce service qui rend le `up -d` suffisant : Odoo crée lui-même la base
  # nommée par --database si elle n'existe pas, et --init y installe les
  # modules. Sans lui il faudrait une commande manuelle après le premier
  # démarrage, et le CRM répondrait « database does not exist » entre-temps.
  #
  # Il se relance à chaque `up`, ce qui est voulu et sans effet : réinstaller
  # un module déjà installé ne fait rien. Cela vaut aussi pour les addons
  # ajoutés plus tard dans addons/ — ils s'installent au redéploiement suivant.
  #
  # Pourquoi un conteneur séparé plutôt que --init sur le serveur lui-même :
  # --init force Odoo à recharger le graphe des modules à CHAQUE démarrage,
  # donc à chaque redémarrage automatique après un incident ou un reboot du
  # VPS. Isolé ici, ce coût n'est payé qu'au déploiement.
  #
  # ⚠️ « Exited (0) » sur ce conteneur n'est pas une panne, c'est son travail
  # terminé.
  odoo-init:
    <<: *odoo-base
    # Surtout pas `unless-stopped` : le conteneur sort volontairement, une
    # politique de redémarrage le relancerait en boucle.
    restart: 'no'
    depends_on:
      postgres_crm:
        condition: service_healthy
    command:
      - odoo
      - --database=${ODOO_DB_NAME:-echango_crm}
      # `base` est implicite (Odoo l'ajoute lui-même à la création de la base).
      # echangocrm_bootstrap applique le mot de passe administrateur ; voir
      # addons/echangocrm_bootstrap/.
      - --init=crm,contacts,calendar,echangocrm_bootstrap
      # `=True` et pas `=all` : depuis Odoo 19 cette option est un booléen, elle
      # ne prend plus une liste de modules. `all` passe encore — Odoo avertit
      # « invalid boolean value: 'all', assume True » et fait ce qu'on veut —
      # mais autant ne pas dépendre d'un repli.
      #
      # Redondant en Odoo 19, qui n'installe plus les données de démonstration
      # par défaut, et gardé quand même : la valeur par défaut de cette option
      # a déjà été inversée une fois. Écrite ici, l'intention ne dépend pas de
      # ce que décidera la prochaine version.
      - --without-demo=True
      - --stop-after-init
      - --log-level=${ODOO_LOG_LEVEL:-warn}
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'

  # ---------------------------------------------------------------------------
  # Odoo 19 — le serveur
  # ---------------------------------------------------------------------------
  odoo:
    <<: *odoo-base
    restart: unless-stopped
    depends_on:
      postgres_crm:
        condition: service_healthy
      # Ne démarre qu'une fois la base créée et les modules installés. Si
      # l'amorçage échoue, le serveur ne démarre pas du tout — préférable à un
      # CRM qui répond des erreurs 500 sur une base à moitié initialisée.
      odoo-init:
        condition: service_completed_successfully
    # Tout est en ligne de commande, il n'y a donc aucun odoo.conf dans ce
    # dépôt. Les valeurs non listées ici sont les défauts d'Odoo, et on s'appuie
    # dessus volontairement : http_port 8069, gevent_port 8072,
    # http_interface 0.0.0.0, plus addons_path et data_dir que l'image
    # officielle fixe déjà à /mnt/extra-addons et /var/lib/odoo.
    command:
      - odoo
      - --database=${ODOO_DB_NAME:-echango_crm}
      # Ancré sur ^…$ : une seule base est visible, aucune autre n'est
      # sélectionnable depuis le web.
      - --db-filter=^${ODOO_DB_NAME:-echango_crm}$$
      # Ferme le gestionnaire de bases : création, duplication, suppression,
      # sauvegarde et restauration renvoient toutes 403, quel que soit le mot
      # de passe maître. C'est ce qui rend inutile de configurer admin_passwd
      # (le seul réglage d'Odoo qui ne peut vivre que dans un fichier, donc le
      # seul qui obligerait à en générer un contenant un secret).
      - --no-database-list
      # Explicite alors que c'est le défaut actuel, parce que ce défaut change :
      # Odoo 19 avertit qu'en 20.0 l'interface d'écoute passera à 127.0.0.1.
      # Le jour de cette montée de version, Odoo n'écouterait plus que sur la
      # boucle locale du conteneur, Traefik ne l'atteindrait plus, et le
      # symptôme serait un 502 sans rapport visible avec la version.
      - --http-interface=0.0.0.0
      # Derrière Traefik : sans cela Odoo construit ses URLs absolues en http://
      # et journalise l'IP du proxy au lieu de celle du client.
      - --proxy-mode
      # ⚠️ Garder >= 2. Avec 0, Odoo passe en mode threadé et le port gevent
      # 8072 n'est PAS servi : le routeur `echangocrm-ws` répond 502 et le temps
      # réel (chat, notifications, activités) tombe en panne silencieuse, sans
      # que le reste du CRM ait l'air cassé.
      - --workers=${ODOO_WORKERS:-2}
      - --max-cron-threads=1
      # 4 processus x 16 = 64 connexions, sous les 100 de max_connections par
      # défaut de Postgres. Le défaut Odoo (64 par processus) saturerait la base.
      #
      # ⚠️ TIRET BAS, pas tiret. Les options du groupe « base de données »
      # d'Odoo s'écrivent --db_host, --db_user, --db_password, --db_maxconn ;
      # seul --db-filter y fait exception. Écrit --db-maxconn, Odoo sort en
      # code 2 (« no such option ») et le conteneur boucle en redémarrage —
      # Traefik retire alors nos routeurs et le catch-all de la stack Vendure
      # sert la boutique sur echangocrm.echango.com, ce qui envoie chercher
      # très loin de la vraie cause.
      - --db_maxconn=16
      # Seuils de recyclage, pas des réservations : un worker qui dépasse la
      # limite douce termine sa requête puis redémarre proprement. Volontairement
      # bas, le VPS héberge plusieurs applications. À monter si les rapports PDF
      # volumineux ou les imports se font tuer.
      - --limit-memory-soft=671088640
      - --limit-memory-hard=838860800
      - --limit-time-cpu=600
      - --limit-time-real=1200
      - --limit-request=8192
      - --log-level=${ODOO_LOG_LEVEL:-warn}
    networks:
      - internal
      - echango_network
    healthcheck:
      # python3 plutôt que curl : c'est l'interpréteur d'Odoo, il est forcément
      # présent, alors que la présence de curl dans l'image amont n'est pas un
      # contrat.
      test:
        - CMD
        - python3
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://localhost:8069/web/health", timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - 'traefik.enable=true'
      # Le conteneur est sur DEUX réseaux. Sans cette ligne, Traefik peut
      # retenir son IP sur le réseau `internal`, qu'il n'atteint pas : le
      # routeur apparaît dans le tableau de bord mais répond 502. La config
      # Traefik de la stack principale fixe déjà un réseau par défaut ; on ne
      # s'y fie pas, ce dépôt ne dépend d'aucun réglage d'un autre dépôt.
      - 'traefik.docker.network=echango_network'

      # --- Services -------------------------------------------------------
      # Odoo écoute sur DEUX ports : 8069 (HTTP) et 8072 (gevent/websocket).
      - 'traefik.http.services.echangocrm-svc.loadbalancer.server.port=8069'
      - 'traefik.http.services.echangocrm-ws-svc.loadbalancer.server.port=8072'

      # --- Middlewares, définis ICI et pas empruntés à la stack Vendure ----
      # Deux raisons. L'autonomie d'abord : `security-headers@file` vit dans le
      # dépôt vendure, le référencer rendrait ce déploiement dépendant d'un
      # fichier d'un autre projet. La correction ensuite : ce middleware-là pose
      # `X-Frame-Options: DENY`, ce qui casse l'éditeur de site et les vues
      # incorporées d'Odoo, qui fonctionnent en iframe de même origine.
      - 'traefik.http.middlewares.echangocrm-headers.headers.stsSeconds=31536000'
      - 'traefik.http.middlewares.echangocrm-headers.headers.stsIncludeSubdomains=true'
      - 'traefik.http.middlewares.echangocrm-headers.headers.stsPreload=true'
      - 'traefik.http.middlewares.echangocrm-headers.headers.contentTypeNosniff=true'
      - 'traefik.http.middlewares.echangocrm-headers.headers.browserXssFilter=true'
      - 'traefik.http.middlewares.echangocrm-headers.headers.customFrameOptionsValue=SAMEORIGIN'
      - 'traefik.http.middlewares.echangocrm-headers.headers.referrerPolicy=strict-origin-when-cross-origin'
      # Un CRM interne n'a rien à faire dans un index : la page de connexion
      # expose le nom de l'organisation et la version d'Odoo.
      - 'traefik.http.middlewares.echangocrm-headers.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow, noarchive'
      - 'traefik.http.middlewares.echangocrm-headers.headers.customResponseHeaders.X-Powered-By='
      - 'traefik.http.middlewares.echangocrm-headers.headers.customResponseHeaders.Server='

      # Compression. `text/event-stream` DOIT rester exclu : comprimer un flux
      # d'événements le met en tampon, et les notifications n'arrivent plus
      # qu'au vidage du tampon — panne intermittente, difficile à rattacher au
      # proxy. Les images du filestore sont déjà comprimées.
      - 'traefik.http.middlewares.echangocrm-compress.compress.excludedcontenttypes=text/event-stream,image/png,image/jpeg,image/webp,image/avif'

      # Refus de /web/database depuis l'extérieur. `ipallowlist` restreint à la
      # boucle locale est l'idiome Traefik pour « interdire ce chemin » : aucune
      # requête entrante ne vient de 127.0.0.1, toutes reçoivent donc 403.
      # Défense en profondeur — Odoo bloque déjà ces routes via
      # --no-database-list ; ceci les rend inatteignables même si ce drapeau
      # venait à sauter lors d'une modification.
      - 'traefik.http.middlewares.echangocrm-no-db-manager.ipallowlist.sourcerange=127.0.0.1/32'

      # --- Routeur HTTP principal -----------------------------------------
      # priority=20 > 5 : le routeur `storefront-vendor` de la stack Vendure est
      # un catch-all HostRegexp sur *.echango.com à la priorité 5. Cette
      # priorité suffit à passer devant, donc AUCUNE modification n'est
      # nécessaire dans le dépôt vendure pour déployer ce CRM.
      - 'traefik.http.routers.echangocrm.rule=Host(`echangocrm.${BASE_DOMAIN:-echango.com}`)'
      - 'traefik.http.routers.echangocrm.entrypoints=websecure'
      - 'traefik.http.routers.echangocrm.priority=20'
      - 'traefik.http.routers.echangocrm.middlewares=echangocrm-headers,echangocrm-compress'
      - 'traefik.http.routers.echangocrm.service=echangocrm-svc'

      # --- Routeur websocket (chat, notifications, activités) --------------
      # priority=25 pour passer devant le routeur principal, dont la règle
      # (Host seul) couvre aussi ce chemin. Sans compression : comprimer une
      # connexion maintenue ouverte n'a pas de sens et introduit du tampon.
      - 'traefik.http.routers.echangocrm-ws.rule=Host(`echangocrm.${BASE_DOMAIN:-echango.com}`) && PathPrefix(`/websocket`)'
      - 'traefik.http.routers.echangocrm-ws.entrypoints=websecure'
      - 'traefik.http.routers.echangocrm-ws.priority=25'
      - 'traefik.http.routers.echangocrm-ws.middlewares=echangocrm-headers'
      - 'traefik.http.routers.echangocrm-ws.service=echangocrm-ws-svc'

      # --- Routeur de refus du gestionnaire de bases -----------------------
      # priority=30 pour passer devant le routeur principal.
      - 'traefik.http.routers.echangocrm-no-db.rule=Host(`echangocrm.${BASE_DOMAIN:-echango.com}`) && PathPrefix(`/web/database`)'
      - 'traefik.http.routers.echangocrm-no-db.entrypoints=websecure'
      - 'traefik.http.routers.echangocrm-no-db.priority=30'
      - 'traefik.http.routers.echangocrm-no-db.middlewares=echangocrm-no-db-manager'
      - 'traefik.http.routers.echangocrm-no-db.service=echangocrm-svc'
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.5'

networks:
  internal:
  echango_network:
    external: true

volumes:
  postgres_data:
  odoo_data:
